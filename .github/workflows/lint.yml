name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # composer test:lint: Pint + Rector (dry run) over the PHP paths, then the vite-plus
    # formatter and linter over the frontend. composer test:type-coverage: Pest's 100%
    # type-coverage gate over app/.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          build: 'false'

      # As in https://getrector.com/documentation/cache-in-ci: cache entries cannot be updated, so
      # each run saves under its own key, also after a failing lint, and restore-keys loads the
      # most recent one.
      - name: Restore Rector cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Lint
        run: composer test:lint

      - name: Save Rector cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: /tmp/rector
          key: ${{ runner.os }}-rector-${{ github.run_id }}

      - name: Type coverage
        run: composer test:type-coverage
