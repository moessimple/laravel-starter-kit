name: security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    # composer test:audit: fails on known CVEs in composer.lock (checked explicitly, not
    # relying on Composer's implicit post-install audit) and in package-lock.json via npm
    # audit. The weekly schedule catches advisories published since the last push.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          build: 'false'

      - name: Audit dependencies
        run: composer test:audit
