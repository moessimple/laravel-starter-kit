name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # composer test:unit: the Pest Arch/Unit/Http suite under a 100% line-coverage gate,
    # then the Vitest unit suite. Lint, static analysis and type coverage are their own
    # workflows so a formatting nit and a real failure are separate red checks.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app
        with:
          coverage: xdebug

      - name: App tests
        run: composer test:unit

  browser:
    # Real-browser tests via pest-plugin-browser + headless Chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup app
        uses: ./.github/actions/setup-app

      - name: Prepare the SQLite database
        run: |
          touch database/database.sqlite
          php artisan migrate --force

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        # No --retry: a browser test that only passes on a re-run is a defect to fix or delete.
        run: composer test:browser

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots/
          if-no-files-found: ignore
          retention-days: 7
